<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BE850</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BE850">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg:      #0f0f0f;
  --surf:    #161616;
  --surf-2:  #1c1c1c;
  --surf-3:  #232323;
  --ring:    rgba(255,255,255,0.08);
  --text:    #e8e8e8;
  --sub:     #aaa;
  --muted:   #777;
  --faint:   #444;
  --sage:    #8a9e89;
  --rose:    #a88585;
  --sand:    #b89870;
  --slate:   #7d94a6;
  --r-card:  18px;
  --r-pill:  9999px;
  --r-chip:  8px;
  --accent:  var(--slate);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  font-weight: 450;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 18px 28px;
  min-height: 100dvh;
}
#app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 22px; flex: 1; }
button { font: inherit; color: inherit; }

/* ─── HERO ─── */
.hero { display: flex; flex-direction: column; gap: 6px; padding: 4px 4px 0; }
.hero h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; }
.hero p { color: var(--sub); font-size: 15px; line-height: 1.55; }

/* ─── OVERVIEW: 4 stat cards ─── */
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.card {
  position: relative;
  background: var(--surf);
  border: 1px solid var(--ring);
  border-radius: var(--r-card);
  padding: 28px 22px 22px;
  text-align: left;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 12px;
  transition: background 0.14s, border-color 0.14s, transform 0.08s;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--accent);
}
.card:hover { background: var(--surf-2); border-color: rgba(255,255,255,0.14); }
.card:active { transform: scale(0.985); }
.card-num {
  font-size: 44px; font-weight: 700; letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  line-height: 1;
}
.card-label { display: flex; flex-direction: column; gap: 2px; }
.card-label-zh { font-size: 16px; font-weight: 600; }
.card-label-en {
  font-size: 11px; color: var(--muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}

/* ─── DECK (flashcard mode) ─── */
#deck { display: flex; flex-direction: column; gap: 16px; flex: 1; }
.deck-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.back-btn {
  background: transparent; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 13px; padding: 6px 4px;
  transition: color 0.12s;
}
.back-btn:hover { color: var(--text); }
.deck-title { display: flex; align-items: baseline; gap: 8px; }
.deck-label-zh { font-size: 15px; font-weight: 600; color: var(--text); }
.deck-label-en {
  font-size: 11px; color: var(--muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.counter {
  font-family: ui-monospace, monospace;
  font-size: 12px; color: var(--muted);
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}

/* ─── FLASHCARD ─── */
.card-stage {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  perspective: 1400px;
  padding: 20px 0;
  min-height: 60vh;
}
.flashcard {
  width: 100%;
  max-width: 380px;
  aspect-ratio: 3 / 4;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.flashcard.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0;
  background: var(--surf);
  border: 1px solid var(--ring);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-card);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column;
  padding: 32px 28px;
  overflow: hidden;
}
.face-front {
  align-items: center;
  justify-content: center;
  text-align: center;
}
.face-back {
  transform: rotateY(180deg);
  justify-content: flex-start;
  gap: 20px;
}

.word-front {
  font-size: 48px; font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  word-break: break-word;
}
@media (max-width: 380px) {
  .word-front { font-size: 40px; }
}
.tap-hint {
  position: absolute; bottom: 18px;
  font-size: 10px; color: var(--faint);
  letter-spacing: 0.1em; text-transform: uppercase;
}
.word-back {
  font-size: 18px; font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.01em;
}
.example {
  font-size: 22px; font-weight: 500;
  line-height: 1.4; color: var(--text);
  letter-spacing: -0.005em;
  flex: 1;
}
@media (max-width: 380px) {
  .example { font-size: 19px; }
}
.op-hl { color: var(--accent); font-weight: 700; }
.pairs {
  font-size: 12px; color: var(--muted);
  letter-spacing: 0.04em;
  padding-top: 12px;
  border-top: 1px solid var(--ring);
  font-family: ui-monospace, monospace;
}

/* ─── NAV ─── */
.deck-nav {
  display: flex; gap: 8px; align-items: center;
}
.nav-btn {
  flex: 1;
  background: var(--surf);
  border: 1px solid var(--ring);
  border-radius: var(--r-pill);
  padding: 13px 12px;
  color: var(--text);
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, opacity 0.12s;
}
.nav-btn:hover:not(:disabled) {
  background: var(--surf-2);
  border-color: rgba(255,255,255,0.14);
}
.nav-btn:active:not(:disabled) { transform: scale(0.98); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-shuffle {
  flex: 0 0 auto;
  width: 44px;
  font-family: ui-monospace, monospace;
  font-size: 13px;
  padding: 13px 0;
}

/* ─── FOOTER ─── */
.footer {
  display: flex; flex-direction: column; gap: 4px;
  margin-top: auto;
  padding-top: 12px;
}
.r2-link {
  color: var(--muted); text-decoration: none;
  font-size: 13px; text-align: center;
  padding: 10px;
  transition: color 0.12s;
}
.r2-link:hover { color: var(--text); }
.source {
  color: var(--faint); font-size: 11px; text-align: center;
}

.error {
  color: var(--rose); padding: 20px; text-align: center;
  background: var(--surf); border: 1px solid var(--ring);
  border-radius: var(--r-card);
}
</style>
</head>
<body>
<main id="app">
  <header class="hero">
    <h1>BE850</h1>
    <p>850 字 = 用最少詞表達任何意思</p>
  </header>

  <section id="overview">
    <div class="cards"></div>
  </section>

  <section id="deck" hidden>
    <div class="deck-head">
      <button type="button" class="back-btn">← 回首頁</button>
      <div class="deck-title">
        <span class="deck-label-zh"></span>
        <span class="deck-label-en"></span>
      </div>
      <span class="counter"></span>
    </div>

    <div class="card-stage">
      <div class="flashcard">
        <div class="face face-front">
          <span class="word-front"></span>
          <span class="tap-hint">tap to flip</span>
        </div>
        <div class="face face-back">
          <span class="word-back"></span>
          <p class="example"></p>
          <div class="pairs"></div>
        </div>
      </div>
    </div>

    <div class="deck-nav">
      <button type="button" class="nav-btn nav-prev">← prev</button>
      <button type="button" class="nav-btn nav-shuffle" title="shuffle deck">⇄</button>
      <button type="button" class="nav-btn nav-next">next →</button>
    </div>
  </section>

  <footer class="footer">
    <a href="paraphrase/" class="r2-link">→ Round 2 練習</a>
    <div class="source">C.K. Ogden《Basic English》(1930)</div>
  </footer>
</main>

<script src="round1-app.js"></script>
</body>
</html>
