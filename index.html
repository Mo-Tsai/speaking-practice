<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BE850 Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BE850">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg:      #0f0f0f;
  --surf:    #161616;
  --surf-2:  #1c1c1c;
  --surf-3:  #232323;
  --ring:    rgba(255,255,255,0.08);
  --text:    #e8e8e8;
  --sub:     #aaa;
  --muted:   #777;
  --faint:   #444;
  --sage:    #8a9e89;
  --rose:    #a88585;
  --sand:    #b89870;
  --slate:   #7d94a6;
  --r-card:  18px;
  --r-pill:  9999px;
  --accent:  var(--sage);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  font-weight: 450;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 18px;
  min-height: 100dvh;
}
#app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
button { font: inherit; color: inherit; }

/* ─── HERO ─── */
.hero { display: flex; flex-direction: column; gap: 4px; padding: 4px 4px 0; }
.hero h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
.hero p { color: var(--sub); font-size: 14px; line-height: 1.55; }

/* ─── LANDING ─── */
#landing {
  display: flex; flex: 1;
  align-items: center; justify-content: center;
  padding: 40px 0;
}
.landing-content {
  display: flex; flex-direction: column;
  align-items: center; gap: 28px;
  text-align: center;
}
.big-cta {
  background: var(--accent);
  color: #0f0f0f;
  border: none;
  border-radius: var(--r-pill);
  padding: 18px 44px;
  font-size: 17px; font-weight: 600;
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: opacity 0.12s, transform 0.08s;
  box-shadow: 0 4px 20px rgba(138, 158, 137, 0.15);
}
.big-cta:hover { opacity: 0.92; }
.big-cta:active { transform: scale(0.98); }
.landing-info {
  color: var(--muted);
  font-size: 13px; line-height: 1.6;
  max-width: 300px;
}

/* ─── DECK ─── */
#deck { display: flex; flex-direction: column; gap: 16px; flex: 1; }
.deck-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px;
}
.deck-tag {
  font-size: 11px; color: var(--muted);
  letter-spacing: 0.08em; text-transform: uppercase;
  font-family: ui-monospace, monospace;
}
.counter {
  font-family: ui-monospace, monospace;
  font-size: 13px; color: var(--text);
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}

/* ─── FLASHCARD ─── */
.card-stage {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  perspective: 1400px;
  padding: 8px 0;
  min-height: 56vh;
}
.flashcard {
  width: 100%;
  max-width: 380px;
  aspect-ratio: 3 / 4;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.flashcard.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0;
  background: var(--surf);
  border: 1px solid var(--ring);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-card);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column;
  padding: 32px 28px;
  overflow: hidden;
}
.face-front {
  align-items: center;
  justify-content: center;
  text-align: center;
}
.face-back {
  transform: rotateY(180deg);
  justify-content: flex-start;
  gap: 14px;
}

.word-front {
  font-size: 48px; font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  word-break: break-word;
}
@media (max-width: 380px) {
  .word-front { font-size: 40px; }
}
.tap-hint {
  position: absolute; bottom: 18px;
  font-size: 10px; color: var(--faint);
  letter-spacing: 0.1em; text-transform: uppercase;
}
.word-back {
  font-size: 18px; font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.01em;
}
.read-prompt {
  font-size: 10px; color: var(--muted);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-top: 2px;
}
.example {
  font-size: 22px; font-weight: 500;
  line-height: 1.4; color: var(--text);
  letter-spacing: -0.005em;
}
@media (max-width: 380px) {
  .example { font-size: 19px; }
}
.op-hl { color: var(--accent); font-weight: 700; }

.listen-btn {
  align-self: flex-start;
  background: var(--surf-2);
  border: 1px solid var(--ring);
  border-radius: var(--r-pill);
  padding: 8px 16px;
  color: var(--text);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.12s, border-color 0.12s;
}
.listen-btn:hover { background: var(--surf-3); border-color: rgba(255,255,255,0.14); }
.listen-btn:active { transform: scale(0.97); }

.pairs {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--ring);
  font-size: 11px; color: var(--muted);
  letter-spacing: 0.04em;
  font-family: ui-monospace, monospace;
}

/* ─── NAV ─── */
.deck-nav {
  display: flex; gap: 8px;
}
.nav-btn {
  flex: 1;
  background: var(--surf);
  border: 1px solid var(--ring);
  border-radius: var(--r-pill);
  padding: 13px 12px;
  color: var(--text);
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, opacity 0.12s;
}
.nav-btn:hover:not(:disabled) {
  background: var(--surf-2);
  border-color: rgba(255,255,255,0.14);
}
.nav-btn:active:not(:disabled) { transform: scale(0.98); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ─── DONE ─── */
#done {
  display: flex; flex: 1;
  align-items: center; justify-content: center;
  padding: 40px 0;
}
.done-content {
  display: flex; flex-direction: column;
  align-items: center; gap: 20px;
  text-align: center;
}
.done-content h2 {
  font-size: 32px; font-weight: 700; letter-spacing: -0.03em;
  color: var(--accent);
}
.done-content p {
  color: var(--sub); font-size: 14px;
  margin-bottom: 8px;
}

/* ─── FOOTER ─── */
.footer {
  display: flex; flex-direction: column; gap: 4px;
  margin-top: auto;
  padding-top: 12px;
}
.r2-link {
  color: var(--muted); text-decoration: none;
  font-size: 12px; text-align: center;
  padding: 8px;
  transition: color 0.12s;
}
.r2-link:hover { color: var(--text); }
.source {
  color: var(--faint); font-size: 10px; text-align: center;
  letter-spacing: 0.02em;
}

.error {
  color: var(--rose); padding: 20px; text-align: center;
  background: var(--surf); border: 1px solid var(--ring);
  border-radius: var(--r-card);
}
</style>
</head>
<body>
<main id="app">
  <header class="hero">
    <h1>BE850 Daily</h1>
    <p>10 nouns a day · read &amp; repeat</p>
  </header>

  <section id="landing">
    <div class="landing-content">
      <button type="button" class="big-cta start-btn">Start today's 10</button>
      <p class="landing-info">
        Flip each card to see the sentence.<br>
        Hear it. Say it back.<br>
        <span class="session-total-info"></span>
      </p>
    </div>
  </section>

  <section id="deck" hidden>
    <div class="deck-head">
      <span class="deck-tag">Nouns · Things</span>
      <span class="counter"></span>
    </div>

    <div class="card-stage">
      <div class="flashcard">
        <div class="face face-front">
          <span class="word-front"></span>
          <span class="tap-hint">tap to flip</span>
        </div>
        <div class="face face-back">
          <span class="word-back"></span>
          <div class="read-prompt">read &amp; repeat</div>
          <p class="example"></p>
          <button type="button" class="listen-btn">▶ Listen</button>
          <div class="pairs"></div>
        </div>
      </div>
    </div>

    <div class="deck-nav">
      <button type="button" class="nav-btn nav-prev">← prev</button>
      <button type="button" class="nav-btn nav-next">next →</button>
    </div>
  </section>

  <section id="done" hidden>
    <div class="done-content">
      <h2>Done</h2>
      <p>10 nouns reviewed</p>
      <button type="button" class="big-cta start-btn">Start another 10</button>
    </div>
  </section>

  <footer class="footer">
    <a href="paraphrase/" class="r2-link">→ Round 2</a>
    <div class="source">C.K. Ogden · Basic English (1930)</div>
  </footer>
</main>

<script src="round1-app.js"></script>
</body>
</html>
