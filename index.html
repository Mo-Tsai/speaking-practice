<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BE850</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BE850">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg:      #0f0f0f;
  --surf:    #161616;
  --surf-2:  #1c1c1c;
  --surf-3:  #232323;
  --ring:    rgba(255,255,255,0.08);
  --text:    #e8e8e8;
  --sub:     #aaa;
  --muted:   #777;
  --faint:   #444;
  --sage:    #8a9e89;
  --rose:    #a88585;
  --sand:    #b89870;
  --slate:   #7d94a6;
  --r-card:  18px;
  --r-pill:  9999px;
  --r-chip:  8px;
  --accent:  var(--slate);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  font-weight: 450;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 18px 40px;
  min-height: 100dvh;
}
#app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 22px; flex: 1; }
button { font: inherit; color: inherit; }

/* ─── HERO ─── */
.hero { display: flex; flex-direction: column; gap: 6px; padding: 4px 4px 0; }
.hero h1 {
  font-size: 36px; font-weight: 700; letter-spacing: -0.03em;
}
.hero p { color: var(--sub); font-size: 15px; line-height: 1.55; }

/* ─── OVERVIEW: 4 stat cards ─── */
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.card {
  position: relative;
  background: var(--surf);
  border: 1px solid var(--ring);
  border-radius: var(--r-card);
  padding: 28px 22px 22px;
  text-align: left;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 12px;
  transition: background 0.14s, border-color 0.14s, transform 0.08s;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--accent);
}
.card:hover { background: var(--surf-2); border-color: rgba(255,255,255,0.14); }
.card:active { transform: scale(0.985); }
.card-num {
  font-size: 44px; font-weight: 700; letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  line-height: 1;
}
.card-label { display: flex; flex-direction: column; gap: 2px; }
.card-label-zh { font-size: 16px; font-weight: 600; }
.card-label-en {
  font-size: 11px; color: var(--muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}

/* ─── DETAIL VIEW ─── */
#detail { display: flex; flex-direction: column; gap: 18px; }
.detail-head { display: flex; flex-direction: column; gap: 6px; }
.back {
  align-self: flex-start;
  background: transparent; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 13px; padding: 6px 0;
  transition: color 0.12s;
}
.back:hover { color: var(--text); }
.detail-title {
  display: flex; align-items: baseline; gap: 12px;
  margin-top: 2px;
}
.detail-num {
  font-size: 36px; font-weight: 700; letter-spacing: -0.03em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.detail-label-zh { font-size: 22px; font-weight: 600; }
.detail-label-en {
  font-size: 12px; color: var(--muted);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-left: auto;
}
.detail-tagline { color: var(--sub); font-size: 14px; line-height: 1.55; }

.detail-search {
  background: var(--surf);
  border: 1px solid var(--ring);
  border-radius: var(--r-pill);
  padding: 10px 16px;
  color: var(--text); font: inherit; font-size: 14px;
  outline: none; width: 100%;
}
.detail-search::placeholder { color: var(--muted); }
.detail-search:focus { border-color: var(--accent); }

/* ─── CHIPS ─── */
.detail-chips {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
  gap: 6px;
}
@media (max-width: 480px) {
  .detail-chips { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
}
.chip {
  background: var(--surf);
  border: 1px solid var(--ring);
  border-radius: var(--r-chip);
  padding: 9px 10px;
  color: var(--text); font-size: 13px; font-weight: 500;
  text-align: center; cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip:hover { background: var(--surf-2); border-color: rgba(255,255,255,0.14); }
.chip:active { transform: scale(0.96); }
.chip-hidden { display: none; }
.chip.expanded {
  background: var(--accent);
  border-color: var(--accent);
  color: #0f0f0f; font-weight: 600;
}

.word-info {
  grid-column: 1 / -1;
  background: var(--surf-2);
  border: 1px solid var(--ring);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-chip);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 6px;
}
.info-zh { color: var(--text); font-size: 15px; font-weight: 500; }
.info-ex { color: var(--sub); font-size: 13px; font-style: italic; line-height: 1.55; }

/* ─── FOOTER ─── */
.footer {
  display: flex; flex-direction: column; gap: 6px;
  margin-top: auto;
  padding-top: 18px;
}
.r2-link {
  color: var(--muted); text-decoration: none;
  font-size: 13px; text-align: center;
  padding: 12px;
  transition: color 0.12s;
}
.r2-link:hover { color: var(--text); }
.source {
  color: var(--faint); font-size: 11px; text-align: center;
}

.error {
  color: var(--rose); padding: 20px; text-align: center;
  background: var(--surf); border: 1px solid var(--ring);
  border-radius: var(--r-card);
}
</style>
</head>
<body>
<main id="app">
  <header class="hero">
    <h1>BE850</h1>
    <p>850 字 = 用最少詞表達任何意思</p>
  </header>

  <section id="overview">
    <div class="cards"></div>
  </section>

  <section id="detail" hidden>
    <button type="button" class="back">← 回首頁</button>
    <div class="detail-head">
      <div class="detail-title">
        <span class="detail-num"></span>
        <span class="detail-label-zh"></span>
        <span class="detail-label-en"></span>
      </div>
      <p class="detail-tagline"></p>
    </div>
    <input type="text" class="detail-search" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="detail-chips"></div>
  </section>

  <footer class="footer">
    <a href="paraphrase/" class="r2-link">→ Round 2 練習</a>
    <div class="source">C.K. Ogden《Basic English》(1930)</div>
  </footer>
</main>

<script src="round1-app.js"></script>
</body>
</html>
