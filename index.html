<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Practice · English Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speaking">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg:      #0f0f0f;
  --surf:    #161616;
  --ring:    rgba(255,255,255,0.06);
  --ring-in: rgba(255,255,255,0.05);
  --div:     rgba(255,255,255,0.05);
  --text:    #e8e8e8;
  --sub:     #888;
  --muted:   #555;
  --faint:   #2e2e2e;
  --sage:    #8a9e89;
  --rose:    #a88585;
  --sand:    #b89870;
  --slate:   #7d94a6;
  --r-app:   20px;
  --r-pill:  9999px;
  --btn-h:   38px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  font-weight: 450; font-feature-settings: "ss02" 0, "cv05" 1;
  -webkit-font-smoothing: antialiased;
  height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
  align-items: center; padding: 10px 16px;
}
#app { width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; overflow: hidden; }
.header-mode-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.page-header { display: flex; align-items: baseline; gap: 8px; }
.page-title { font-size: 1rem; font-weight: 650; letter-spacing: -0.015em; color: var(--text); }
.page-sub   { font-size: 0.875rem; font-weight: 400; color: var(--muted); }

/* ── Score panel ── */
.score-panel {
  width: 100%; background: var(--surf); border-radius: 12px;
  padding: 8px 14px; display: flex; align-items: center; gap: 0;
  box-shadow: inset 0 0 0 1px var(--ring-in); flex-shrink: 0;
}
.score-group { display: flex; gap: 14px; flex: 1; }
.score-item { display: flex; flex-direction: column; gap: 1px; }
.score-label { font-family: ui-monospace, monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.score-val { font-size: 0.95rem; font-weight: 650; letter-spacing: -0.04em; color: var(--text); }
.score-val.good { color: var(--sage); }
.score-val.bad  { color: var(--rose); }
.score-val.rate-good { color: var(--sage); }
.score-val.rate-ok   { color: var(--sand); }
.score-val.rate-bad  { color: var(--rose); }
#btn-reset {
  height: 28px; padding: 0 12px; font-family: inherit; font-size: 0.7rem;
  font-weight: 500; letter-spacing: 0.03em; background: transparent;
  color: var(--muted); border-radius: var(--r-pill);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);
  transition: color 0.12s, box-shadow 0.12s;
}
#btn-reset:hover { color: var(--rose); box-shadow: inset 0 0 0 1px rgba(168,133,133,0.3); }

/* ── Progress counter ── */
#word-counter { font-size: 0.75rem; color: var(--faint); line-height: 2; width: 100%; }

/* ── Streak bar ── */
.streak-bar {
  width: 100%; background: var(--surf); border-radius: 10px;
  padding: 8px 14px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: inset 0 0 0 1px var(--ring-in); flex-shrink: 0; gap: 10px;
}
.streak-label { font-family: ui-monospace, monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.streak-val { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.04em; color: var(--sand); }
.streak-dots { display: flex; gap: 5px; }
.streak-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); transition: background 0.2s; }
.streak-dot.done { background: var(--sand); }
.streak-dot.today { background: var(--sage); box-shadow: 0 0 6px rgba(138,158,137,0.5); }

/* ── Mission card ── */
.mission-card {
  width: 100%; background: var(--surf); border-radius: 14px;
  box-shadow: inset 0 0 0 1px var(--ring-in); flex-shrink: 0;
  display: flex; flex-direction: column; overflow: hidden;
}
.mission-header {
  padding: 12px 16px 8px; border-bottom: 1px solid var(--div);
}
.mission-week { font-family: ui-monospace, monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin-bottom: 4px; }
.mission-title { font-size: 1rem; font-weight: 650; letter-spacing: -0.02em; color: var(--text); }
.mission-scenario {
  padding: 10px 16px; font-size: 0.8rem; color: var(--sub); line-height: 1.55;
  border-bottom: 1px solid var(--div);
}
.mission-scenario strong { color: var(--text); font-weight: 550; }
.mission-prompt {
  padding: 10px 16px 12px;
  font-size: 0.82rem; color: var(--slate); line-height: 1.5;
  font-style: italic;
}

/* ── Mission list ── */
.mission-list {
  width: 100%; display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto; flex: 1; padding-bottom: 4px;
}
.mission-item {
  width: 100%; background: var(--surf); border-radius: 10px;
  padding: 10px 14px; display: flex; align-items: center; gap: 10px;
  box-shadow: inset 0 0 0 1px var(--ring-in);
  cursor: pointer; transition: box-shadow 0.12s;
}
.mission-item:active { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
.mission-item.locked { opacity: 0.35; cursor: default; }
.mission-item.completed .mission-item-icon { color: var(--sage); }
.mission-item.active-mission { box-shadow: inset 0 0 0 1.5px var(--slate); }
.mission-item-num { font-family: ui-monospace, monospace; font-size: 0.7rem; color: var(--muted); min-width: 20px; }
.mission-item-name { flex: 1; font-size: 0.82rem; font-weight: 500; color: var(--text); }
.mission-item-icon { font-size: 0.9rem; }
.mission-week-label {
  font-family: ui-monospace, monospace; font-size: 0.58rem; text-transform: uppercase;
  letter-spacing: 0.09em; color: var(--muted); padding: 6px 2px 2px; width: 100%;
}

/* ── Self-evaluation box ── */
.self-eval {
  width: 100%; background: var(--surf); border-radius: 12px;
  box-shadow: inset 0 0 0 1px var(--ring-in);
  padding: 12px 14px; flex-shrink: 0; display: none;
}
.self-eval.visible { display: block; }
.self-eval .eval-label { font-family: ui-monospace, monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin-bottom: 8px; }
.self-eval .eval-buttons { display: flex; gap: 6px; }
.self-eval .eval-btn {
  flex: 1; height: 34px; font-family: inherit; font-size: 0.75rem; font-weight: 550;
  border: none; border-radius: 8px; cursor: pointer;
  transition: background 0.12s, box-shadow 0.12s;
}
.eval-btn.excellent { background: rgba(138,158,137,0.15); color: var(--sage); box-shadow: inset 0 0 0 1px rgba(138,158,137,0.3); }
.eval-btn.excellent:hover { background: rgba(138,158,137,0.25); }
.eval-btn.good { background: rgba(184,152,112,0.15); color: var(--sand); box-shadow: inset 0 0 0 1px rgba(184,152,112,0.3); }
.eval-btn.good:hover { background: rgba(184,152,112,0.25); }
.eval-btn.needs-work { background: rgba(168,133,133,0.15); color: var(--rose); box-shadow: inset 0 0 0 1px rgba(168,133,133,0.3); }
.eval-btn.needs-work:hover { background: rgba(168,133,133,0.25); }
.eval-btn:disabled { opacity: 0.4; cursor: default; }
.eval-result { margin-top: 8px; font-size: 0.8rem; color: var(--sub); line-height: 1.5; }

/* ── Mission complete overlay ── */
.mission-complete {
  width: 100%; background: var(--surf); border-radius: 14px;
  box-shadow: inset 0 0 0 1px rgba(138,158,137,0.3);
  padding: 20px 16px; text-align: center; flex-shrink: 0; display: none;
}
.mission-complete.visible { display: block; }
.mission-complete-icon { font-size: 2.2rem; margin-bottom: 8px; }
.mission-complete-title { font-size: 1rem; font-weight: 650; color: var(--sage); margin-bottom: 4px; }
.mission-complete-sub { font-size: 0.78rem; color: var(--sub); line-height: 1.5; }

/* ── Mission view layout ── */
.mission-view { display: flex; flex-direction: column; gap: 6px; width: 100%; height: 100%; overflow: hidden; }
.mission-practice-area { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; }
.mission-nav-row { display: flex; gap: 6px; width: 100%; flex-shrink: 0; }
.mission-nav-row button { flex: 1; }

/* ── Practice mode toggle ── */
.mode-toggle {
  display: flex; width: auto; background: var(--surf);
  border-radius: 9px; padding: 3px;
  box-shadow: inset 0 0 0 1px var(--ring-in); flex-shrink: 0;
}
.mode-btn {
  width: 68px; height: 28px; padding: 0; font-family: inherit;
  font-size: 0.75rem; font-weight: 550; font-feature-settings: "ss02" 0;
  background: transparent; color: var(--muted); border: none;
  border-radius: 6px; letter-spacing: 0.02em; cursor: pointer;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
}
.mode-btn.active {
  background: #222; color: var(--text);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 1px 4px rgba(0,0,0,0.5);
}

/* ── Card mode selector ── */
.card-mode-row {
  width: 100%; display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0;
}
.card-mode-btn {
  flex: 1; min-width: 0; height: 26px; padding: 0 6px; font-family: inherit;
  font-size: 0.68rem; font-weight: 500; letter-spacing: 0.02em;
  background: var(--surf); color: var(--muted); border: none;
  border-radius: 7px; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}
.card-mode-btn.active {
  background: #222; color: var(--text);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 1px 4px rgba(0,0,0,0.4);
}
.card-mode-btn:hover:not(.active) { color: var(--sub); }

.card {
  width: 100%; background: var(--surf); border-radius: var(--r-app);
  padding: 14px 16px; display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px var(--ring), 0 4px 20px rgba(0,0,0,0.5);
  flex: 1; min-height: 0; overflow-y: auto;
}
.card-block { padding: 8px 0; }
.card-block:first-child { padding-top: 0; }
.card-block:last-of-type { padding-bottom: 10px; }
.card-divider { height: 1px; background: var(--div); margin: 0 -16px; }
.eyebrow {
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.65rem; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px;
}

/* ── Word display with status dot ── */
.word-header { display: flex; align-items: center; gap: 10px; }
.status-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--faint); margin-top: 3px;
  transition: background 0.2s;
}
.status-dot.correct { background: var(--sage); }
.status-dot.wrong   { background: var(--rose); }

.word-display {
  font-size: 1.9rem; font-weight: 650; line-height: 1.15;
  letter-spacing: -0.03em; color: #f4f4f4; text-wrap: balance;
}
.translation-toggle { padding: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
.trans-btn {
  align-self: flex-start; height: 24px; padding: 0 10px;
  font-family: inherit; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.04em;
  background: transparent; color: var(--muted); border-radius: var(--r-pill);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);
  transition: color 0.12s, box-shadow 0.12s; cursor: pointer;
}
.trans-btn:hover { color: var(--sub); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
.translation {
  font-size: 0.85rem; font-weight: 400; color: var(--muted); line-height: 1.6;
}
.example {
  font-size: 0.9rem; font-weight: 400; color: var(--sub);
  line-height: 1.8; font-style: italic; text-wrap: pretty; max-width: 42ch;
}
.example.target { color: #d0d0d0; font-style: normal; }
.speak-row {
  display: flex; gap: 6px; width: 100%;
  border-top: 1px solid var(--div); padding-top: 10px;
}
.speak-row button {
  flex: 1; height: calc(var(--btn-h) - 4px); padding: 0;
  font-family: inherit; font-size: 0.78rem; font-weight: 550;
  background: var(--bg); color: #888; border: none;
  border-radius: var(--r-pill); letter-spacing: 0.01em; cursor: pointer;
  transition: background 0.12s, color 0.12s, box-shadow 0.12s;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);
}
.speak-row button:hover:not(:disabled) {
  background: #1c1c1c; color: var(--text);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.11);
}
.speak-row button.speaking { color: var(--slate); box-shadow: inset 0 0 0 1px var(--slate); }
#btn-speed.slow { color: var(--sage); box-shadow: inset 0 0 0 1px var(--sage); }
.result-box {
  width: 100%; background: var(--surf); border-radius: 12px;
  padding: 10px 14px; min-height: 0; display: flex;
  flex-direction: column; gap: 6px; font-size: 0.85rem;
  transition: box-shadow 0.25s; box-shadow: inset 0 0 0 1px var(--ring-in);
  flex-shrink: 0;
}
.result-box:empty { display: none; }
.result-box.correct { box-shadow: inset 0 0 0 1px rgba(138,158,137,0.3), 0 0 0 1px rgba(138,158,137,0.08); }
.result-box.wrong   { box-shadow: inset 0 0 0 1px rgba(168,133,133,0.3), 0 0 0 1px rgba(168,133,133,0.08); }
.result-header { display: flex; align-items: center; gap: 8px; }
.result-icon { font-size: 1rem; }
.result-title { font-weight: 600; font-size: 0.88rem; letter-spacing: -0.01em; }
.result-box.correct .result-title { color: var(--sage); }
.result-box.wrong   .result-title { color: var(--rose); }
.diff-detail { font-size: 0.82rem; display: flex; flex-direction: column; gap: 5px; padding-top: 10px; border-top: 1px solid var(--div); }
.diff-row { display: flex; gap: 10px; align-items: baseline; }
.diff-label { font-family: ui-monospace, monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); min-width: 64px; }
.diff-word { font-family: ui-monospace, monospace; font-size: 0.88rem; letter-spacing: 0.02em; }
.diff-correct    { color: var(--text); }
.diff-wrong-char { color: var(--rose); font-weight: 700; }
.diff-missing    { color: #2a2a2a; }
#interim { font-size: 0.72rem; color: #444; line-height: 1.6; min-height: 0; width: 100%; }
#interim:empty { display: none; }
button {
  border: none; cursor: pointer;
  font-family: "Inter", system-ui, sans-serif; font-feature-settings: "ss02" 0;
  transition: background 0.12s, box-shadow 0.12s, color 0.12s, transform 0.08s;
  -webkit-tap-highlight-color: transparent;
}
button:active  { transform: scale(0.97); }
button:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; width: 100%; }
#btn-record {
  flex: 1; height: var(--btn-h); padding: 0 20px;
  font-size: 0.875rem; font-weight: 550; background: #1c1c1c; color: var(--text);
  border-radius: var(--r-pill); display: flex; align-items: center;
  justify-content: center; gap: 6px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 1px 5px rgba(0,0,0,0.5);
}
#btn-record:hover:not(:disabled) { background: #222; box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 2px 10px rgba(0,0,0,0.5); }
#btn-record.recording {
  background: #1c1c1c; color: var(--rose);
  box-shadow: 0 0 0 1px rgba(168,133,133,0.3);
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0   rgba(168,133,133,0.3), 0 0 0 1px rgba(168,133,133,0.3); }
  70%  { box-shadow: 0 0 0 8px rgba(168,133,133,0),   0 0 0 1px rgba(168,133,133,0.3); }
  100% { box-shadow: 0 0 0 0   rgba(168,133,133,0),   0 0 0 1px rgba(168,133,133,0.3); }
}
#btn-next {
  height: var(--btn-h); padding: 0 18px; font-size: 0.8rem; font-weight: 550;
  background: transparent; color: var(--muted); border-radius: var(--r-pill);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.07);
}
#btn-next:hover:not(:disabled) { background: #181818; color: var(--text); box-shadow: 0 0 0 1px rgba(255,255,255,0.1); }
.stats {
  width: 100%; background: var(--surf); border-radius: 14px;
  padding: 16px 20px; display: flex; justify-content: space-between;
  align-items: center; box-shadow: inset 0 0 0 1px var(--ring-in);
}
.stats-left { display: flex; flex-direction: column; gap: 3px; }
.stats-numbers { font-size: 0.82rem; color: var(--muted); line-height: 2; }
.stats-numbers strong { color: var(--text); font-weight: 600; }
.rate { font-size: 1.3rem; font-weight: 650; letter-spacing: -0.04em; }
.rate.good { color: var(--sage); }
.rate.ok   { color: var(--sand); }
.rate.bad  { color: var(--rose); }
.notice { background: var(--surf); border-radius: 14px; padding: 24px; color: var(--rose); font-size: 0.875rem; line-height: 2; width: 100%; box-shadow: inset 0 0 0 1px rgba(168,133,133,0.15); }

/* ── IPA phonetic display ── */
.word-ipa {
  font-size: 0.95rem;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 0.04em;
  margin-top: 5px;
  min-height: 1.4em;
  font-style: normal;
}
.word-ipa.loading { color: var(--faint); font-size: 0.75rem; }

/* ── Sentence chunks + stress ── */
.example-chunks {
  display: flex; flex-wrap: wrap; gap: 4px 2px;
  align-items: baseline; line-height: 2.2;
}
.chunk {
  display: inline-flex; gap: 3px; align-items: baseline;
  background: rgba(255,255,255,0.035); border-radius: 7px;
  padding: 1px 7px; margin: 1px 2px;
}
.chunk-sep {
  color: var(--faint); font-size: 0.7rem;
  align-self: center; margin: 0 1px; user-select: none;
}
.w-stress {
  color: #dcdcdc; font-weight: 550; font-size: 0.9rem;
}
.w-reduce {
  color: var(--muted); font-weight: 400; font-size: 0.8rem;
  letter-spacing: 0.01em;
}

/* ── Settings panel ── */
.settings-toggle-btn {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  background: var(--surf); border-radius: 10px; padding: 10px 16px; cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--ring-in); font-size: 0.8rem; font-weight: 500;
  color: var(--muted); letter-spacing: 0.02em; border: none;
  transition: color 0.12s;
}
.settings-toggle-btn:hover { color: var(--sub); }
.settings-panel {
  width: 100%; background: var(--surf); border-radius: 14px;
  padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: inset 0 0 0 1px var(--ring-in);
}
.settings-field { display: flex; flex-direction: column; gap: 5px; }
.settings-label {
  font-family: ui-monospace, monospace; font-size: 0.65rem;
  text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
}
.settings-input {
  height: 36px; padding: 0 12px; background: var(--bg); color: var(--text);
  border-radius: 8px; font-family: ui-monospace, monospace; font-size: 0.8rem;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); border: none;
  width: 100%;
}
.settings-input:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }
.settings-save-btn {
  align-self: flex-end; height: 30px; padding: 0 16px;
  font-size: 0.75rem; font-weight: 550; background: #1c1c1c;
  color: var(--text); border-radius: var(--r-pill); border: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); cursor: pointer;
  transition: background 0.12s;
}
.settings-save-btn:hover { background: #222; }

/* ── Repeat toggle ── */
.repeat-row {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0 0; margin-top: 8px;
  border-top: 1px solid var(--div);
  cursor: pointer; user-select: none;
}
.repeat-label { font-size: 0.8rem; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
.repeat-sublabel { font-size: 0.68rem; color: var(--faint); margin-top: 1px; }
.repeat-label-group { display: flex; flex-direction: column; }
.toggle-wrap { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track {
  position: absolute; inset: 0; border-radius: 24px;
  background: var(--faint);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  transition: background 0.2s, box-shadow 0.2s;
}
.toggle-thumb {
  position: absolute; top: 3px; left: 3px;

// ── CSV parser ──────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = splitCSVLine(lines[0]);
  return lines.slice(1).map(line => {
    const vals = splitCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i] || '').trim(); });
    return obj;
  }).filter(r => r['Word']);
}

function splitCSVLine(line) {
  const result = [];
  let cur = '', inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else inQuote = !inQuote;
    } else if (c === ',' && !inQuote) {
      result.push(cur); cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur);
  return result;
}

const FUNC_WORDS = new Set([
  'the','a','an','is','are','was','were','be','been','being',
  'have','has','had','do','does','did','will','would','shall',
  'should','may','might','must','can','could',
  'to','of','in','on','at','by','for','with','from','up',

  'and','or','but','so','yet','nor',
  'as','if','than','though','although','because','since',
  'while','when','where','what','whether'
]);

const CHUNK_BREAK_BEFORE = new Set([
  'in','on','at','by','for','with','from','into','through',
  'during','before','after','above','below','between','among',
  'and','or','but','so','because','since','while','when','where',
  'although','though','if','which','who','whom','that'
]);

function renderSentenceWithStress(sentence) {
  const tokens = sentence.trim().split(/\s+/);
  const chunks = [];
  let cur = [];
  tokens.forEach((tok, i) => {
    const clean = tok.toLowerCase().replace(/[^a-z']/g, '');
    if (i > 0 && CHUNK_BREAK_BEFORE.has(clean) && cur.length > 0) {
      chunks.push(cur); cur = [];
    }
    cur.push(tok);
    if (cur.length >= 4 && i < tokens.length - 1) {
      chunks.push(cur); cur = [];
    }
  });
  if (cur.length) chunks.push(cur);

  return '<span class="example-chunks">' +
    chunks.map((chunk, ci) => {
      const inner = chunk.map(tok => {
        const clean = tok.toLowerCase().replace(/[^a-z']/g, '');
        const cls = FUNC_WORDS.has(clean) ? 'w-reduce' : 'w-stress';
        return `<span class="${cls}">${tok}</span>`;
      }).join(' ');
      const sep = ci < chunks.length - 1
        ? '<span class="chunk-sep"> | </span>' : '';
      return `<span class="chunk">${inner}</span>${sep}`;
    }).join('') +
  '</span>';
}

// ── IPA cache ────────────────────────────────────────────────────────────────
const IPA_CACHE_KEY = 'speaking-practice-ipa';
let ipaCache = {};
try { ipaCache = JSON.parse(localStorage.getItem(IPA_CACHE_KEY)) || {}; } catch {}

async function fetchIPA(word) {
  const key = word.toLowerCase().trim();
  if (ipaCache[key] !== undefined) { showIPA(ipaCache[key]); return; }
  const el = document.getElementById('word-ipa');
  if (el) { el.className = 'word-ipa loading'; el.textContent = '…'; }
  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    const phonetic = data[0]?.phonetics?.find(p => p.text)?.text
      || data[0]?.phonetic
      || '';
    ipaCache[key] = phonetic;
    const entries = Object.keys(ipaCache);
    if (entries.length > 2000) entries.slice(0, 200).forEach(k => delete ipaCache[k]);
    localStorage.setItem(IPA_CACHE_KEY, JSON.stringify(ipaCache));
    showIPA(phonetic);
  } catch {
    ipaCache[key] = '';
    showIPA('');
  }
}

function showIPA(text) {
  const el = document.getElementById('word-ipa');
  if (!el) return;
  el.className = 'word-ipa';
  el.textContent = text || '';
}

// ── Session queue ─────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueue() {
  let pool;
  const unlIdx = words.map((_, i) => i).filter(i => !wordStatus[words[i]['Word']]);
  const wrgIdx = words.map((_, i) => i).filter(i => wordStatus[words[i]['Word']] === 'wrong');
  const allIdx = words.map((_, i) => i);

  if (cardMode === 'unlearned') {
    pool = unlIdx.length > 0 ? unlIdx : allIdx;
  } else if (cardMode === 'wrong') {
    pool = wrgIdx.length > 0 ? wrgIdx : allIdx;
  } else if (cardMode === 'smart') {
    if (unlIdx.length > 0) pool = unlIdx;
    else if (wrgIdx.length > 0) pool = wrgIdx;
    else pool = allIdx;
  } else {
    pool = allIdx;
  }

  sessionQueue = shuffle(pool);
  sessionQueueIdx = 0;
}

function pickNext() {
  if (sessionQueueIdx >= sessionQueue.length) buildQueue();
  return words[sessionQueue[sessionQueueIdx++]];
}

// ── Mission State ─────────────────────────────────────────────────────────────
const MISSION_LS = 'sp-missions-v1';
const STREAK_LS  = 'sp-streak-v1';

function loadMissionState() { try { return JSON.parse(localStorage.getItem(MISSION_LS)) || {}; } catch { return {}; } }
function saveMissionState(s) { localStorage.setItem(MISSION_LS, JSON.stringify(s)); }
function loadStreak() { try { return JSON.parse(localStorage.getItem(STREAK_LS)) || { days:0, lastDate:null, history:[] }; } catch { return { days:0, lastDate:null, history:[] }; } }
function saveStreak(s) { localStorage.setItem(STREAK_LS, JSON.stringify(s)); }
function todayStr() { return new Date().toISOString().slice(0,10); }

function updateStreakOnComplete() {
  const s = loadStreak();
  const today = todayStr();
  if (s.lastDate === today) return s;
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const yStr = yest.toISOString().slice(0,10);
  s.days = s.lastDate === yStr ? s.days + 1 : 1;
  s.lastDate = today;
  if (!s.history) s.history = [];
  if (!s.history.includes(today)) s.history.push(today);
  saveStreak(s); return s;
}

function renderStreakBar() {
  const s = loadStreak();
  const today = todayStr();
  const last7 = [];
  for (let i=6;i>=0;i--) { const d=new Date(); d.setDate(d.getDate()-i); last7.push(d.toISOString().slice(0,10)); }
  const hist = s.history || [];
  const dots = last7.map(d => {
    if (d===today && hist.includes(d)) return `<div class="streak-dot today"></div>`;
    if (hist.includes(d)) return `<div class="streak-dot done"></div>`;
    return `<div class="streak-dot"></div>`;
  }).join('');
  return `<div class="streak-bar">
    <div><div class="streak-label">Streak</div><div class="streak-val">${s.days} day${s.days!==1?'s':''} 🔥</div></div>
    <div class="streak-dots">${dots}</div>
  </div>`;
}

function getUnlockedUpTo() {
  const st = loadMissionState();
  let max = 1;
  for (const m of MISSIONS) { if (st[m.id]==='done') max = Math.min(m.id+1, 30); }
  return max;
}

function renderMissionList() {
  const st = loadMissionState();

    if (m.week !== lastWeek) { html += `<div class="mission-week-label">Week ${m.week}</div>`; lastWeek = m.week; }

      <span class="mission-item-name">${m.title}</span>
      <span class="mission-item-icon">${icon}</span>

  }
  return html;
}

    ${renderStreakBar()}
    <div class="mission-practice-area">
      <div class="mission-card">
        <div class="mission-header">
          <div class="mission-week">Week ${m.week} · Mission ${m.id} / 30</div>
          <div class="mission-title">${m.title}</div>
        </div>
        <div class="mission-scenario">${m.scenario}</div>
        <div class="mission-prompt">🎯 ${m.prompt}</div>
      </div>
      <div style="font-size:0.72rem;color:var(--muted);padding:0 2px;line-height:1.5;flex-shrink:0;">💡 ${m.tip}</div>
      <div id="mission-interim" style="min-height:36px;font-size:0.8rem;color:var(--sub);padding:6px 10px;background:var(--surf);border-radius:10px;box-shadow:inset 0 0 0 1px var(--ring-in);"></div>
      <div class="self-eval${done?' visible':''}" id="mission-eval">
        <div class="eval-label">How did you do?</div>
        <div class="eval-buttons">
          <button class="eval-btn excellent" onclick="missionSelfEval('Excellent')"${done?' disabled':''}>Excellent</button>
          <button class="eval-btn good" onclick="missionSelfEval('Good')"${done?' disabled':''}>Good</button>
          <button class="eval-btn needs-work" onclick="missionSelfEval('Needs Work')"${done?' disabled':''}>Needs Work</button>
        </div>
        ${savedFb ? `<div class="eval-result">${savedFb}</div>` : ''}
      </div>
      <div class="mission-complete${done?' visible':''}" id="mission-complete">
        <div class="mission-complete-icon">🎉</div>
        <div class="mission-complete-title">Mission Complete!</div>
        <div class="mission-complete-sub">Great work. Move to the next mission when ready.</div>
      </div>
    </div>
    <div class="mission-nav-row">
      <button onclick="selectMission(null)" style="flex:0 0 auto;padding:0 16px;">← Back</button>
      <button id="btn-mission-record">${done?'🔁 Redo':'🎤 Hold to Speak'}</button>
      ${done && m.id<30 ? `<button onclick="goNextMission()" style="flex:0 0 auto;padding:0 16px;">Next →</button>` : ''}
    </div>`;

  const recBtn = document.getElementById('btn-mission-record');
  recBtn.addEventListener('mousedown', missionStartRecording);
  recBtn.addEventListener('touchstart', e=>{e.preventDefault();missionStartRecording();});
  recBtn.addEventListener('mouseup', missionStopRecording);
  recBtn.addEventListener('touchend', e=>{e.preventDefault();missionStopRecording();});
  recBtn.addEventListener('mouseleave', ()=>{if(missionRecording)missionStopRecording();});
}

function selectMission(id) {
  if (id && id > getUnlockedUpTo()) return;
  activeMissionId = id;
  buildMissionView();
}

function goNextMission() {
  if (activeMissionId < 30) selectMission(activeMissionId + 1);
}

// ── Mission Recording ─────────────────────────────────────────────────────────
let missionRecognition = null;

function missionStartRecording() {
  if (missionRecording || !SR) return;
  missionRecording = true; missionTranscript = '';
  const btn = document.getElementById('btn-mission-record');
  if (btn) { btn.classList.add('recording'); btn.textContent='🔴 Listening…'; }

  missionRecognition = new SR();
  missionRecognition.lang = 'en-US';
  missionRecognition.interimResults = true;
  missionRecognition.continuous = true;

  missionRecognition.onresult = e => {
    let interim='', final='';
    for (let i=e.resultIndex;i<e.results.length;i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t+' '; else interim += t;
    }
    missionTranscript += final;
    const el = document.getElementById('mission-interim');
    if (el) el.textContent = (missionTranscript+interim).trim();
  };
  missionRecognition.onerror = ()=>missionResetRecordBtn();
  missionRecognition.onend = ()=>missionResetRecordBtn();
  missionRecognition.start();
}

function missionStopRecording() {
  if (!missionRecording||!missionRecognition) return;
  missionRecognition.stop();
  setTimeout(()=>{
    if(missionTranscript.trim().length>5) {
      const evalBox = document.getElementById('mission-eval');
      if (evalBox) evalBox.classList.add('visible');
    }
  }, 500);
}

function missionResetRecordBtn() {
  missionRecording = false;
  const btn = document.getElementById('btn-mission-record');
  if (btn) { btn.classList.remove('recording'); btn.textContent='🎤 Hold to Speak'; }
}

function missionSelfEval(score) {
  const m = MISSIONS.find(x=>x.id===activeMissionId);
  if (!m) return;

  // Disable buttons after selection
  document.querySelectorAll('.eval-btn').forEach(b => b.disabled = true);

  // Save result
  const resultText = `You rated: <strong>${score}</strong>`;
  const evalBox = document.getElementById('mission-eval');
  let resultEl = evalBox?.querySelector('.eval-result');
  if (!resultEl) {
    resultEl = document.createElement('div');
    resultEl.className = 'eval-result';
    evalBox?.appendChild(resultEl);
  }
  resultEl.innerHTML = resultText;

  const st = loadMissionState();
  st[m.id] = 'done'; st['fb_'+m.id] = resultText;
  saveMissionState(st);
  updateStreakOnComplete();

  const completeEl = document.getElementById('mission-complete');
  if (completeEl) completeEl.classList.add('visible');

  const navRow = document.querySelector('.mission-nav-row');
  if (navRow && m.id<30 && !document.getElementById('btn-m-next')) {
    const nb = document.createElement('button');
    nb.id='btn-m-next'; nb.style.cssText='flex:0 0 auto;padding:0 16px;';
    nb.textContent='Next →'; nb.onclick=()=>goNextMission();
    navRow.appendChild(nb);
  }
}

// ── Mission mode switch ───────────────────────────────────────────────────────
function showMissionView() {
  ['card-mode-row','word-counter'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.style.display='none';
  });
  document.querySelector('.score-panel')?.style.setProperty('display','none');
  document.querySelector('.card')?.style.setProperty('display','none');
  document.getElementById('result-box')?.style.setProperty('display','none');
  document.getElementById('interim')?.style.setProperty('display','none');
  document.querySelector('.btn-row')?.style.setProperty('display','none');

  let mv = document.getElementById('mission-view');
  if (!mv) {
    mv = document.createElement('div');
    mv.id='mission-view'; mv.className='mission-view';
    document.getElementById('app').appendChild(mv);
  }
  mv.style.display='flex';
  buildMissionView();
}

function hideMissionView() {
  const mv = document.getElementById('mission-view');
  if (mv) mv.style.display='none';
  ['card-mode-row','word-counter'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.style.display='';
  });
  document.querySelector('.score-panel')?.style.removeProperty('display');
  document.querySelector('.card')?.style.removeProperty('display');
  document.getElementById('result-box')?.style.removeProperty('display');
  document.getElementById('interim')?.style.removeProperty('display');
  document.querySelector('.btn-row')?.style.removeProperty('display');
}

// ── Card mode ─────────────────────────────────────────────────────────────────
function setCardMode(mode) {
  cardMode = mode;
  document.querySelectorAll('.card-mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cmode === mode);
  });
  buildQueue();
  nextWord();
}

// ── Word logic ─────────────────────────────────────────────────────────────────
function nextWord() {
  abortRepeat();
  const chk = document.getElementById('toggle-repeat');
  if (chk) chk.checked = false;
  if (isRecording) stopRecording();
  current = pickNext();

  document.getElementById('word-display').textContent = current['Word'] || '—';

  // IPA phonetic
  const ipaEl = document.getElementById('word-ipa');
  if (ipaEl) { ipaEl.className = 'word-ipa'; ipaEl.textContent = ''; }
  if (current['Word']) fetchIPA(current['Word']);

  // Status dot
  const dot = document.getElementById('status-dot');
  const st = wordStatus[current['Word']];
  dot.className = 'status-dot' + (st ? ' ' + st : '');

  const transEl = document.getElementById('translation');
  transEl.textContent = current['Translation/Explanation'] || current['Translation'] || '—';
  transEl.style.display = 'none';
  const transBtn = document.getElementById('btn-trans');
  if (transBtn) transBtn.textContent = 'Translation ▼';
  renderExample(current['Example Sentence'] || '(no example)');
  document.getElementById('result-box').className = 'result-box';
  document.getElementById('result-box').innerHTML = '';
  document.getElementById('interim').textContent = '';
  updateCounter();

  const btn = document.getElementById('btn-record');
  btn.disabled = false;
  btn.textContent = '🎤 Hold to Speak';
  btn.classList.remove('recording');
}

function updateCounter() {
  const total = words.length;
  const practiced = Object.keys(wordStatus).length;
  const correct = Object.values(wordStatus).filter(v => v === 'correct').length;
  const wrong = Object.values(wordStatus).filter(v => v === 'wrong').length;
  const unlearned = total - practiced;
  const wc = document.getElementById('word-counter');
  if (wc) wc.textContent = `Practiced ${practiced} / ${total}  ·  Unlearned ${unlearned}  ·  Correct ${correct}  ·  Wrong ${wrong}`;
}

// ── Reset progress ────────────────────────────────────────────────────────────
function resetProgress() {
  if (!confirm('Reset all progress and start over?')) return;
  wordStatus = {};
  localStorage.removeItem(LS_KEY);
  stats = { correct: 0, wrong: 0 };
  updateScorePanel();
  buildQueue();
  nextWord();
}

// ── Mode toggle ───────────────────────────────────────────────────────────────
function setMode(mode) {
  practiceMode = mode;
  document.getElementById('mode-word').classList.toggle('active', mode==='word');
  document.getElementById('mode-sentence').classList.toggle('active', mode==='sentence');
  document.getElementById('mode-mission').classList.toggle('active', mode==='mission');
  if (mode==='mission') {
    showMissionView(); return;
  }
  hideMissionView();
  const label = document.getElementById('example-label');
  if (label) label.textContent = mode==='sentence' ? 'Example · say the full sentence' : 'Example · say the word aloud';
  const exEl = document.getElementById('example');
  if (exEl) exEl.classList.toggle('target', mode==='sentence');
  if (current) renderExample(current['Example Sentence']||'(no example)');
  updateRepeatSublabel();
}

function renderExample(sentence) {
  const el = document.getElementById('example');
  if (!el) return;
  if (practiceMode === 'sentence') {
    el.innerHTML = renderSentenceWithStress(sentence);
  } else {
    el.textContent = sentence;
  }
}

// ── Translation toggle ────────────────────────────────────────────────────────
function toggleTranslation() {
  const el = document.getElementById('translation');
  const btn = document.getElementById('btn-trans');
  const visible = el.style.display !== 'none';
  el.style.display = visible ? 'none' : 'block';
  btn.textContent = visible ? 'Translation ▼' : 'Translation ▲';
}


function stopCurrentAudio() {
  window.speechSynthesis.cancel();
}

function speakText(text, btn) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = slowMode ? 0.6 : 1.0;
  if (btn) {
    btn.classList.add('speaking'); btn.disabled = true;
    const done = () => { btn.classList.remove('speaking'); btn.disabled = false; };
    utter.onend = done; utter.onerror = done;
  }
  window.speechSynthesis.speak(utter);
}

function speakWord() {
  if (!current) return;
  speakText(current['Word'], document.getElementById('btn-speak'));
}

function speakSentence() {
  if (!current) return;
  const sentence = current['Example Sentence'];
  if (!sentence) return;
  speakText(sentence, document.getElementById('btn-speak-sentence'));
}

function toggleSpeed() {
  slowMode = !slowMode;
  const btn = document.getElementById('btn-speed');
  btn.textContent = slowMode ? '🐢 Slow' : '▶ Normal';
  btn.classList.toggle('slow', slowMode);
}


// ── Recording ─────────────────────────────────────────────────────────────────
function startRecording() {
  if (isRecording || !SR) return;
  isRecording = true;
  const btn = document.getElementById('btn-record');
  btn.classList.add('recording');
  btn.textContent = '🔴 Listening…';

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;
  recognition.continuous = false;

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    if (interim) document.getElementById('interim').textContent = interim;
    if (final) processResult(final);
  };

  recognition.onerror = (e) => {
    console.warn('SR error', e.error);
    resetRecordBtn();
    if (e.error === 'no-speech') {
      document.getElementById('interim').textContent = 'No speech detected, please try again.';
    }
  };

  recognition.onend = () => { resetRecordBtn(); };
  recognition.start();
}

function stopRecording() {
  if (!isRecording || !recognition) return;
  recognition.stop();
}

function resetRecordBtn() {
  isRecording = false;
  const btn = document.getElementById('btn-record');
  if (!btn) return;
  btn.classList.remove('recording');
  btn.textContent = '🎤 Hold to Speak';
}

// ── Comparison ────────────────────────────────────────────────────────────────
function normalize(s) {
  return s.toLowerCase().trim().replace(/[^a-z\s'-]/g, '');
}

function bestMatchWord(transcript, answer) {
  const parts = normalize(transcript).split(/\s+/);
  if (parts.length === 1) return parts[0];
  return parts.reduce((best, w) =>
    charSimilarity(w, answer) >= charSimilarity(best, answer) ? w : best, parts[0]);
}

function charSimilarity(a, b) {
  let matches = 0;
  const len = Math.max(a.length, b.length);
  for (let i = 0; i < Math.min(a.length, b.length); i++) {
    if (a[i] === b[i]) matches++;
  }
  return len === 0 ? 1 : matches / len;
}

function buildDiffHTML(word, answer) {
  const maxLen = Math.max(word.length, answer.length);
  let html = '';
  for (let i = 0; i < maxLen; i++) {
    const wc = word[i], ac = answer[i];
    if (!wc) html += `<span class="diff-missing">_</span>`;
    else if (wc === ac) html += `<span class="diff-correct">${wc}</span>`;
    else html += `<span class="diff-wrong-char">${wc}</span>`;
  }
  return html;
}

function buildAnswerDiffHTML(word, answer) {
  const maxLen = Math.max(word.length, answer.length);
  let html = '';
  for (let i = 0; i < maxLen; i++) {
    const wc = word[i], ac = answer[i];
    if (!ac) html += `<span class="diff-missing">_</span>`;
    else if (wc === ac) html += `<span class="diff-correct">${ac}</span>`;
    else html += `<span class="diff-wrong-char">${ac}</span>`;
  }
  return html;
}

function processResult(transcript) {
  if (!current) return;

  let correct;
  if (practiceMode === 'sentence') {
    const answerWords = normalize(current['Example Sentence'] || '').split(/\s+/).filter(Boolean);
    const spokenWords = new Set(normalize(transcript).split(/\s+/).filter(Boolean));
    const matched = answerWords.filter(w => spokenWords.has(w)).length;
    correct = answerWords.length > 0 && matched / answerWords.length >= 0.85;
  } else {
    const answer = normalize(current['Word']);
    const spoken = normalize(transcript);
    correct = spoken === answer || spoken.split(/\s+/).includes(answer);
  }

  // Update session stats
  if (correct) stats.correct++; else stats.wrong++;

  // Update localStorage status (most recent answer wins)
  wordStatus[current['Word']] = correct ? 'correct' : 'wrong';
  saveStatus();

  // Update status dot
  const dot = document.getElementById('status-dot');
  if (dot) { dot.className = 'status-dot ' + (correct ? 'correct' : 'wrong'); }

  showResult(correct, transcript.trim());
  updateScorePanel();
  updateCounter();

  resetRecordBtn();
  document.getElementById('btn-record').disabled = true;
}

function updateScorePanel() {
  const total = stats.correct + stats.wrong;
  document.getElementById('sp-correct').textContent = stats.correct;
  document.getElementById('sp-wrong').textContent = stats.wrong;
  const rateEl = document.getElementById('sp-rate');
  if (total === 0) { rateEl.textContent = '—'; rateEl.className = 'score-val'; return; }
  const pct = Math.round(stats.correct / total * 100);
  rateEl.textContent = pct + '%';
  rateEl.className = 'score-val ' + (pct >= 80 ? 'rate-good' : pct >= 50 ? 'rate-ok' : 'rate-bad');
}

function showResult(correct, spokenRaw) {
  const box = document.getElementById('result-box');
  if (correct) {
    box.className = 'result-box correct';
    box.innerHTML = `
      <div class="result-header">
        <span class="result-icon">✅</span>
        <span class="result-title">Correct! Great pronunciation!</span>
      </div>`;
    return;
  }
  box.className = 'result-box wrong';
  if (practiceMode === 'sentence') {
    const answerWords = normalize(current['Example Sentence'] || '').split(/\s+/).filter(Boolean);
    const spokenWords = normalize(spokenRaw).split(/\s+/).filter(Boolean);
    const spokenSet = new Set(spokenWords);
    const answerHTML = answerWords.map(w =>
      spokenSet.has(w)
        ? `<span class="diff-correct">${w}</span>`
        : `<span class="diff-wrong-char">${w}</span>`
    ).join(' ');
    box.innerHTML = `
      <div class="result-header">
        <span class="result-icon">❌</span>
        <span class="result-title">Try again</span>
      </div>
      <div class="diff-detail">
        <div class="diff-row"><span class="diff-label">You said:</span><span class="diff-word" style="white-space:normal;line-height:1.6;">${normalize(spokenRaw)}</span></div>
        <div class="diff-row"><span class="diff-label">Correct:</span><span class="diff-word" style="white-space:normal;line-height:1.6;">${answerHTML}</span></div>
      </div>`;
  } else {
    const answer = normalize(current['Word']);
    const bestWord = bestMatchWord(spokenRaw, answer);
    box.innerHTML = `
      <div class="result-header">
        <span class="result-icon">❌</span>
        <span class="result-title">Try again</span>
      </div>
      <div class="diff-detail">
        <div class="diff-row"><span class="diff-label">You said:</span><span class="diff-word">${buildDiffHTML(bestWord, answer)}</span></div>
        <div class="diff-row"><span class="diff-label">Correct:</span><span class="diff-word">${buildAnswerDiffHTML(bestWord, answer)}</span></div>
      </div>`;
  }
}

// ── Repeat × 3 toggle ────────────────────────────────────────────────────────
function updateRepeatSublabel() {
  const el = document.getElementById('repeat-sublabel');
  if (el) el.textContent = practiceMode === 'sentence' ? 'speak this sentence 3 times' : 'speak this word 3 times';
}

function abortRepeat() {
  if (repeatAbortCtrl) { repeatAbortCtrl.abort(); repeatAbortCtrl = null; }
  stopCurrentAudio();
  const prog = document.getElementById('repeat-progress');
  if (prog) prog.textContent = '';
}

function sleep(ms, signal) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(resolve, ms);
    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); }, { once: true });
  });
}

async function onRepeatToggle() {
  const chk = document.getElementById('toggle-repeat');
  if (!chk.checked) { abortRepeat(); return; }

  abortRepeat();

  const ctrl = new AbortController();
  repeatAbortCtrl = ctrl;
  const sig = ctrl.signal;

  const text = practiceMode === 'sentence'
    ? (current?.['Example Sentence'] || '')
    : (current?.['Word'] || '');
  if (!text) { chk.checked = false; return; }

  const prog = document.getElementById('repeat-progress');
  try {
    for (let i = 1; i <= 3; i++) {
      if (sig.aborted) break;
      if (prog) prog.textContent = `${i} / 3`;
      await new Promise((resolve, reject) => {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = slowMode ? 0.6 : 1.0;
        utter.onend = resolve;
        utter.onerror = reject;
        sig.addEventListener('abort', () => { window.speechSynthesis.cancel(); reject(new DOMException('Aborted', 'AbortError')); }, { once: true });
        window.speechSynthesis.speak(utter);
      });
      if (i < 3) await sleep(320, sig);
    }
  } catch (e) { /* aborted */ }

  if (prog) prog.textContent = '';
  chk.checked = false;
  repeatAbortCtrl = null;
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  if (!SR) {
    app.innerHTML = `<div class="notice">
      ⚠️ 您的瀏覽器不支援語音辨識 API。<br><br>
      請使用 <strong>Google Chrome</strong> 瀏覽器開啟此頁面。
    </div>`;
    return;
  }
  try {
    const resp = await fetch('./notebooklm_words.csv');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    words = parseCSV(text);
    if (words.length === 0) throw new Error('CSV 無有效資料');
    buildUI();
  } catch (err) {
    app.innerHTML = `<div class="notice">
      ⚠️ 無法載入單字檔案。<br><br>
      請確認 <code>notebooklm_words.csv</code> 存在於同一目錄下。<br>
      <small style="color:#888;">(${err.message})</small>
    </div>`;
  }
}

init();
